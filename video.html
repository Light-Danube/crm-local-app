<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Play Video</title>
    <style>
      body {
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
  
      #videoContainer {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
  
      #videoPlayer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
  
      .input-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        margin-bottom: 20px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
  
      .input-container button {
        padding: 10px 20px;
        border-radius: 5px;
        border: none;
        background-color: lightgreen;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="videoContainer">
      <video id="videoPlayer" style="width: 100%">
        Your browser does not support the video tag.
      </video>
    </div>
  
    <div class="input-container">
      <button id="connectToMasterButton">Приєднати екран</button>
    </div>

    <div style="position:fixed;top:8px;left:8px;color:white;z-index:10">
      <p id="connectionStatus" role="status"></p>
      <button type="button" id="resumePlayback" hidden>Відновити відтворення</button>
      <button type="button" id="resetSession" hidden>Повторити єднання</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/src/video-url.js"></script>
    <script src="/src/player-session.js"></script>
    <script>
      const videoPlayer = document.getElementById("videoPlayer");
      const userIDButton = document.getElementById("connectToMasterButton");

      let optimizeColorChecked = false;
      let enhanceDetailsChecked = false;
      let backgroundOptChecked = false;

      //PUPPET LOAD
      // Connect to the playerControls namespace
      let displaySession;
      try { displaySession = JSON.parse(sessionStorage.getItem('displaySession')); } catch {}
      if (!displaySession || typeof displaySession.sessionId !== 'string' || typeof displaySession.displayToken !== 'string') displaySession = null;
      const socket = io('/playerControls', { transports: ['websocket'], autoConnect: false, reconnectionDelayMax: 1000, timeout: 2000 });
      let mediaAuthorization = Promise.resolve();
      const resetSessionButton = document.getElementById('resetSession');
      function requirePairing() {
        resetSessionButton.hidden = false;
        userIDButton.style.display = 'block';
      }
      const playerSession = createPlayerSession({
        socket, video: videoPlayer,
        statusElement: document.getElementById('connectionStatus'),
        resumeButton: document.getElementById('resumePlayback'),
        getSessionId: () => displaySession?.sessionId,
        beforeSnapshot: () => mediaAuthorization,
        onExpired: requirePairing,
        onSnapshot: snapshot => {
          optimizeColorChecked = snapshot.effects.color;
          enhanceDetailsChecked = snapshot.effects.details;
          backgroundOptChecked = snapshot.effects.background;
          videoPlayer.style.transform = snapshot.effects.inversion ? 'scaleX(-1)' : 'scaleX(1)';
          applyFilters();
        },
      });
      resetSessionButton.addEventListener('click', () => {
        socket.disconnect();
        sessionStorage.removeItem('displaySession');
        displaySession = null;
        socket.auth = {};
        resetSessionButton.hidden = true;
        userIDButton.style.display = 'block';
        socket.connect();
      });


      userIDButton.addEventListener('click', () => {
        // Display a prompt to enter the master ID
        const userID = prompt("Вставте чи введіть код доступу до сторінки-контролера");

        if (userID) {
          socket.emit('connectToMaster', userID);
        } else {
          alert("Введіть код доступу зі сторінки контролера!");
        }
      });

      socket.on('masterConnected', ({ sessionId, displayId, displayToken }) => {
        displaySession = {
          sessionId, displayId: displayId || displaySession?.displayId,
          displayToken: displayToken || displaySession?.displayToken,
        };
        sessionStorage.setItem('displaySession', JSON.stringify(displaySession));
        socket.auth = { role: 'display', sessionId, token: displaySession.displayToken };
        resetSessionButton.hidden = true;
        mediaAuthorization = fetch(`/api/sessions/${sessionId}/media-access`, {
          method: 'POST', headers: { Authorization: `Bearer ${displaySession.displayToken}` },
        }).then(response => { if (!response.ok) throw new Error('Media access denied'); });
        mediaAuthorization.catch(() => alert('Не вдалося відкрити медіа. Повторіть єднання.'));
        // Disable Enterance puppet elements
        userIDButton.style.display = 'none';

        // Show elements
        videoPlayer.style.display = 'block';
      });
    
      socket.on('session error', () => { alert('Не вдалося приєднати екран. Перевірте код доступу або оновіть його на контролері.'); });
      socket.on('session revoked', requirePairing);

      socket.on('error', (errorMessage) => {
        alert(errorMessage);
      });

      // Revisioned playback/effects and media are handled by playerSession.

      function applyFilters() {
          let filters = "";

          if (optimizeColorChecked) {
              filters += " contrast(130%) saturate(130%)";
          }

          if (enhanceDetailsChecked) {
              filters += " brightness(110%) blur(0.25px)";
          }

          // Optimize Background filters (using CSS filters):
          if (backgroundOptChecked) {
            filters += " contrast(150%) drop-shadow(0 0 5px rgba(255, 0, 0, 0.5)) hue-rotate(15deg)";
          }

          videoPlayer.style.filter = filters || "none";
      }
      if (displaySession) socket.auth = { role: 'display', sessionId: displaySession.sessionId, token: displaySession.displayToken };
      socket.connect();
    </script>
  </body>
</html>
